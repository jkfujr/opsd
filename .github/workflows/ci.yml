name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: 安装依赖
        run: |
          npm ci
          npm --prefix frontend ci
      - name: 生成接口并构建双架构程序
        run: |
          npm run build
          git diff --exit-code -- api/openapi.json internal/httpapi/api.gen.go frontend/src/api/schema.gen.ts
          test "$(artifacts/opsd-linux-amd64 version --plain)" = "$(node -p 'require("./package.json").version')"
          sh -n artifacts/install.sh
      - name: 后端测试
        run: |
          docker pull busybox:1.37.0
          OPSD_DOCKER_TEST=1 npm test
      - name: 原生互信规则与新连接
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -q
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -q nftables iptables firewalld ufw fonts-noto-cjk
          go test -c -o artifacts/firewall-native.test ./internal/firewall
          sudo env OPSD_NATIVE_TRUST=1 artifacts/firewall-native.test -test.run '^TestPeerTrustNativeNetwork$' -test.v
      - name: 安装生产程序并检查控制台
        run: |
          chmod +x artifacts/opsd-linux-amd64
          sudo sh scripts/check-installer.sh
          sudo systemctl stop firewalld.service nftables.service || true
          sudo ufw --force reset > /dev/null
          sudo ufw default allow incoming > /dev/null
          sudo ufw --force enable > /dev/null
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "OPSD_UI_PASSWORD=$password" >> "$GITHUB_ENV"
          sudo env OPSD_PASSWORD="$password" artifacts/opsd-linux-amd64 install --non-interactive --address http://127.0.0.1:8444 -n ui-check --username ui-check --entrance /signin > artifacts/install-check.log
          if sudo /opt/opsd/bin/opsd network --listen 127.0.0.1:8444 > artifacts/network-running.log 2>&1; then exit 1; fi
          grep -q '请先停止 opsd.service' artifacts/network-running.log
          sudo systemctl stop opsd.service opsd-executor.service
          sudo /opt/opsd/bin/opsd network --listen 127.0.0.1:8444 --address-mode manual --address http://127.0.0.1:8444
          sudo systemctl start opsd-executor.service opsd.service
          sudo /opt/opsd/bin/opsd install -n '重复安装保留账号' --address http://127.0.0.1:1
          sudo /opt/opsd/bin/opsd console --enabled=true
          docker run -d --name opsd-ui-container --label com.docker.compose.project=ui-demo --label com.docker.compose.service=web busybox:1.37.0 sh -c 'trap "exit 0" TERM INT; while :; do echo "界面验收容器输出"; echo "界面验收错误输出" >&2; sleep 1; done'
          npx playwright install --with-deps chromium
      - name: 生产界面与交互
        run: node scripts/check-ui.mjs
      - name: 停止验收服务
        if: always()
        run: |
          sudo systemctl stop opsd.service opsd-executor.service || true
          docker rm -f opsd-ui-container || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check
          path: artifacts/ui
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: opsd-linux
          path: |
            artifacts/opsd-linux-amd64
            artifacts/opsd-linux-arm64
            artifacts/install.sh
          retention-days: 14
          if-no-files-found: error
