package: httpapi
generate:
  models: true
  std-http-server: true
  strict-server: true
output: internal/httpapi/api.gen.go
output-options:
  skip-prune: false
  include-operation-ids:
    - login
    - logout
    - getSession
    - listSessions
    - revokeSession
    - listNodes
    - getNode
    - renameNode
    - revokeNode
    - listEnrollmentTokens
    - createEnrollmentToken
    - revokeEnrollmentToken
    - getAccount
    - changeAccount
    - getVersion
    - readFirewall
    - listOperations
    - listPendingOperations
    - getOperation
    - confirmOperation
    - recoverOperation
    - resolveOperation
    - installFirewall
    - getOverview
    - getMonitoringHistory
    - getNodeSettings
    - changeNodeSettings
    - getNodeAccount
    - changeNodeAccount
    - revealNodePassword
    - getStorageStatus
    - cancelOperation
    - changeFirewallConfig
    - syncFirewallConfig
    - getPublicAddresses
    - changePublicAddresses
    - refreshPublicAddresses
    - getPeerTrust
    - changePeerTrust
    - getPeerTrustStatus
    - getNodePeerTrust
    - listContainers
    - getContainer
    - changeContainer
    - getContainerLogs
    - listAPITokens
    - createAPIToken
    - updateAPIToken
    - deleteAPIToken
    - regenerateAPIToken
    - verifyAPIToken
    - getMonitoringCurrent
    - discoverDatabases
    - saveDatabaseInstance
    - listDatabaseClusters
    - createDatabaseCluster
    - getDatabaseCluster
    - updateDatabaseCluster
    - changeDatabase
    - getDatabaseBackups
